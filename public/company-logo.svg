<svg
  width="500"
  height="500"
  viewBox="0 0 500 500"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Outer Circle -->
  <circle
    cx="250"
    cy="250"
    r="230"
    fill="none"
    stroke="#1C1C1E"
    stroke-width="6"
  />

  <!-- Inner Circle -->
  <circle
    cx="250"
    cy="250"
    r="200"
    fill="none"
    stroke="#C6A75E"
    stroke-width="2"
  />

  <!-- Top Text -->
  <path
    id="topTextPath"
    d="M 90 250 A 160 160 0 0 1 410 250"
    fill="none"
  />
  <text
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    letter-spacing="3"
    fill="#1C1C1E"
  >
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      ESTATE SERVICES
    </textPath>
  </text>

  <!-- Bottom Text -->
  <path
    id="bottomTextPath"
    d="M 410 250 A 160 160 0 0 1 90 250"
    fill="none"
  />
  <text
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    letter-spacing="2"
    fill="#f6f3ee"
  >
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      COLLECTIVE
    </textPath>
  </text>

  <!-- Center Monogram -->
  <text
    x="250"
    y="270"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    fill="#1C1C1E"
    letter-spacing="4"
  >
    ESC
  </text>

</svg>
